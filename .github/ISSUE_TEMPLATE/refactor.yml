name: Refactor
description: A structure change with the same behavior
labels: ["type: refactor"]
body:
  - type: markdown
    attributes:
      value: |
        This applies `type: refactor`. Add at least one `area:` label. See docs/github.md.
  - type: textarea
    id: what
    attributes:
      label: What moves, and what stays the same
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: "Add the matching area: label on the issue."
      multiple: true
      options:
        - contracts
        - dialects
        - adapters
        - runtime
        - tooling
        - ci
        - docs
    validations:
      required: true
