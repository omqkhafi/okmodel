version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type: chore"
      - "area: ci"
    groups:
      github-actions:
        patterns:
          - "*"
    # The release-gate test pins actions/cache v5.1.0 (Node 24). v6 does not run in pull-request CI.
    ignore:
      - dependency-name: actions/cache
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type: chore"
      - "area: ci"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type: chore"
      - "area: ci"
    groups:
      site:
        patterns:
          - "*"
