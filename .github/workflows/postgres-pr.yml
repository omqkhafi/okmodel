name: Postgres

# Real Postgres on a pull request is opt-in. `gate / check` already covers
# PGlite and the wire server. The label `needs: postgres` runs `suite / 15`,
# `suite / 18`, and `tarball / 18`. Adding or removing that label starts this
# workflow. Release and weekly call the suite and tarball workflows with every
# supported major.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: postgres-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: suite
    if: "contains(github.event.pull_request.labels.*.name, 'needs: postgres')"
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-suite.yml
    with:
      versions: '["15", "18"]'

  tarball:
    name: tarball
    if: "contains(github.event.pull_request.labels.*.name, 'needs: postgres')"
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-tarball.yml
    with:
      versions: '["18"]'
