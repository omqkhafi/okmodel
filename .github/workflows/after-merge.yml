name: After merge

# Push to main, and nightly at 03:00 UTC. A failure opens or updates one issue.
# Pull requests do not run this workflow. `gate / check` stays on ci.yml.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.event_name == 'schedule' && 'after-merge-nightly' || format('after-merge-{0}', github.sha) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: changes / filter
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.plan.outputs.source }}
      built: ${{ steps.plan.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Bun
        id: bun-pin
        run: echo "version=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-pin.outputs.version }}

      - name: Plan
        id: plan
        run: bun ./scripts/ci-test-groups.ts --matrix

  build:
    name: build / dist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  types:
    name: types / full
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Cache TypeScript
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'tsconfig.build.json', 'src/**/*.ts', 'scripts/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts') }}
          restore-keys: tsc-${{ runner.os }}-

      - name: Editor
        run: bun run editor-check

      - name: Type cost
        run: bun run type-cost

  test:
    name: test / ${{ matrix.group }}
    needs: changes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.source) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Test
        run: |
          files="$(bun ./scripts/ci-test-groups.ts "${{ matrix.group }}")"
          if [ -z "$files" ]; then
            echo "no test files"
            exit 1
          fi
          bun test $files

  test-dist:
    name: test / ${{ matrix.group }}
    needs: [changes, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.built) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Test
        run: |
          test -f dist/contracts/index.js
          files="$(bun ./scripts/ci-test-groups.ts "${{ matrix.group }}")"
          if [ -z "$files" ]; then
            echo "no test files"
            exit 1
          fi
          bun test $files

  runtimes:
    name: runtimes / portable
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Runtimes
        run: bun run test:runtimes

  temporal:
    name: temporal / node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Date/time columns
        run: |
          bun build scripts/node-temporal.ts --target node --external temporal-polyfill --outfile ./node_modules/.cache/okm-temporal.mjs
          if [ "${{ matrix.node }}" = "26" ]; then
            node ./node_modules/.cache/okm-temporal.mjs
          else
            node ./node_modules/.cache/okm-temporal.mjs --polyfill
          fi

  attest:
    name: attest / measure
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Attest
        run: bun run attest

  windows:
    name: windows / host
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml

  package:
    name: package / checks
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Dist is present
        run: test -f dist/contracts/index.js

      - name: Publint
        run: bun run publint

      - name: Are the types wrong
        run: bun run attw

      - name: Packed files are tracked
        run: bun run pack-tracked

      - name: Pack contract
        run: bun run pack-contract

  size:
    name: inform / size
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Dist is present
        run: test -f dist/contracts/index.js

      - name: Size
        run: bun run size

      - name: Attribute gated graphs
        run: bun ./scripts/size-attribution.ts

  inform:
    name: inform / pack
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Pack twice on this runner
        run: bun ./scripts/pack-stability.ts

      - name: Published 0.9.1
        continue-on-error: true
        run: bun ./scripts/verify-release.ts 0.9.1

  suite:
    name: suite
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-suite.yml
    with:
      versions: '["15", "16", "17", "18"]'
      dist_artifact: dist

  lifecycle:
    name: lifecycle / ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ["15", "16", "17", "18"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Pull Postgres
        run: docker pull "postgres:${POSTGRES_VERSION}"
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Lifecycle property
        run: bun test tests/lifecycle/lifecycle-pg.test.ts
        env:
          REQUIRE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}
          OKM_LIFECYCLE: "1"
          OKM_LIFECYCLE_TIER: "nightly"
          OKM_LIFECYCLE_CASES: "300"
          OKM_LIFECYCLE_RANDOM: "1"

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

  tarball:
    name: tarball
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-tarball.yml
    with:
      versions: '["15", "16", "17", "18"]'
      dist_artifact: dist

  issue:
    name: gate / issue
    needs:
      [
        changes,
        build,
        types,
        test,
        test-dist,
        runtimes,
        temporal,
        attest,
        windows,
        package,
        size,
        inform,
        suite,
        lifecycle,
        tarball,
      ]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Bun
        id: bun-pin
        run: echo "version=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-pin.outputs.version }}

      - name: Open or update one issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          bun ./scripts/ci-issue.ts
          changes=${{ needs.changes.result }}
          build=${{ needs.build.result }}
          types=${{ needs.types.result }}
          test=${{ needs.test.result }}
          test-dist=${{ needs.test-dist.result }}
          runtimes=${{ needs.runtimes.result }}
          temporal=${{ needs.temporal.result }}
          attest=${{ needs.attest.result }}
          windows=${{ needs.windows.result }}
          package=${{ needs.package.result }}
          size=${{ needs.size.result }}
          inform=${{ needs.inform.result }}
          suite=${{ needs.suite.result }}
          lifecycle=${{ needs.lifecycle.result }}
          tarball=${{ needs.tarball.result }}
