name: PR meta

# A pull request update is the CI workflow. This file runs only when the
# title, a label, or the milestone changes, so that event is its own run and
# a code push is not a second one. Labels added with GITHUB_TOKEN do not
# start another workflow.
#
# pull_request_target runs this file from the base branch. Pull request code
# is never checked out and never executed. Lint checks out the base commit.
on:
  pull_request_target:
    types:
      - edited
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions: {}

concurrency:
  group: pr-meta-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint / pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Lint pull request
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/pr-lint.ts --pr "$PR_NUMBER"
