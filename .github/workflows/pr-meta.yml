name: PR meta

# A title edit re-checks the title and refreshes labels. A code push is the
# CI workflow, not this one. pull_request_target runs this file from the
# default branch. Pull request code is never checked out and never executed.
on:
  pull_request_target:
    types:
      - edited
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions: {}

concurrency:
  group: pr-meta-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint / pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      # The checkout above is the base. A fork must not choose the Bun that
      # runs with the write token. An empty pin is a failure, not "latest".
      - name: Require pinned Bun
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < .bun-version)"
          if [ -z "$pin" ]; then
            echo ".bun-version is missing or empty" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Lint pull request
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/pr-lint.ts --pr "$PR_NUMBER"

      - name: Label by title
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
          OKM_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/pr-labels.ts --pr "$PR_NUMBER"
