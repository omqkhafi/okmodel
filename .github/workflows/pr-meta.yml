name: PR meta

# labeler adds area: labels from changed paths, then lint checks the title,
# the closing line, one type: label, at least one area: label, and a
# milestone. Labels added with GITHUB_TOKEN do not start another workflow, so
# both jobs live here and lint waits for labeler.
#
# pull_request_target runs this file from the base branch. Pull request code
# is never checked out and never executed: labeler reads the changed paths
# through the API, and lint checks out the base commit.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions: {}

concurrency:
  group: pr-meta-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  labeler:
    name: label / paths
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label by path
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

  lint:
    name: lint / pull request
    needs: labeler
    if: >-
      !cancelled() &&
      (needs.labeler.result == 'success' || needs.labeler.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Lint pull request
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/pr-lint.ts --pr "$PR_NUMBER"
