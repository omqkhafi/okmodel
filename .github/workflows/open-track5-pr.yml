name: Open track5 PR
# One-shot bootstrap: cloud agent lacks pull-requests:write. Delete after the PR exists.
on:
  push:
    branches: [fix/docs-site-404-redirects]
jobs:
  open:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create pull request if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh pr list --head fix/docs-site-404-redirects --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --base main \
              --head fix/docs-site-404-redirects \
              --title 'fix(site): return 404 for unknown docs pages and redirect old docs URLs' \
              --body-file .github/track5-pr-body.md
          else
            echo 'PR already open'
          fi
          PR=$(gh pr list --head fix/docs-site-404-redirects --state open --json number --jq '.[0].number')
          echo "PR=$PR"
          gh label create 'type: fix' --force >/dev/null 2>&1 || true
          gh label create 'area: docs' --force >/dev/null 2>&1 || true
          gh pr edit "$PR" --add-label 'type: fix' --add-label 'area: docs' || true
          gh issue edit 639 --add-label 'type: fix' --add-label 'area: docs' || true
          if ! gh api repos/${{ github.repository }}/milestones --jq '.[]|select(.title=="0.10.2")|.number' | grep -q .; then
            gh api repos/${{ github.repository }}/milestones -f title='0.10.2' -f description='Patch train after 0.10.1' || true
          fi
          MS=$(gh api repos/${{ github.repository }}/milestones --jq '.[]|select(.title=="0.10.2")|.number' | head -1)
          if [ -n "${MS:-}" ]; then
            gh issue edit "$PR" --milestone '0.10.2' || true
            gh issue edit 639 --milestone '0.10.2' || true
          fi
