name: Deploy site

# Production deploys of site/. A push to main does not run this file.
# site/vercel.json turns off the Vercel Git integration for main, so a
# forgotten production-branch setting still does not publish main. Pull
# requests still get preview deployments.
#
# The Vercel project's production branch is `release`. This job only moves
# that branch. Vercel builds it. The first push creates the branch.
#
# After the Release workflow finishes successfully, this moves `release` to
# the commit that Release built. A failed Release skips the job. A manual
# run takes a v* tag and moves `release` to that tag's commit. The tag must
# be v plus the package.json version at that commit, and the version must be
# a release (X.Y.Z). A prerelease is refused.
#
# The job then fetches the production origin until the page contains that
# version. A Vercel build takes minutes. The wait budget is 12 minutes.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy, v plus the package version
        required: true
        type: string

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy / production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Require pinned Bun
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < .bun-version)"
          if [ -z "$pin" ]; then
            echo ".bun-version is missing or empty" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Require a stable release tag
        id: release
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          DEPLOY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bun ./scripts/deploy-ref.ts

      - name: Move the release branch
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refusing to move release to a commit that is not 40 hex digits." >&2
            exit 1
          fi
          git push --force origin "$SHA:refs/heads/release"

      - name: Confirm the deployed version
        env:
          DEPLOY_VERSION: ${{ steps.release.outputs.version }}
        run: bun ./scripts/deploy-ref.ts --confirm
