name: CI

# Runner: every job runs on ubuntu-24.04, not ubuntu-latest. The image is
# pinned, so moving to a newer Ubuntu is a deliberate change made in a pull
# request, not something GitHub does when it moves the latest label.
#
# A push runs on main only, and that push runs check and attest. `check` calls
# check.yml, so the pieces show up as `CI / check / *`. The postgres job
# (suite and tarball) runs on pull requests. Release and weekly call
# postgres.yml themselves. A newer run on the same ref cancels the older one.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  postgres:
    name: postgres
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres.yml
    with:
      suite_versions: '["15", "18"]'
      tarball_versions: '["18"]'

  attest:
    name: attest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Attest
        run: bun run attest
