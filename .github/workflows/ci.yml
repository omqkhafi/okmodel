name: CI

# Runner: every job runs on ubuntu-24.04, not ubuntu-latest. The image is
# pinned, so moving to a newer Ubuntu is a deliberate change made in a pull
# request, not something GitHub does when it moves the latest label.
#
# A push runs on main only, and that push runs check and attest. The postgres
# job (suite and tarball) runs on pull requests. Release and weekly call
# postgres.yml themselves. A newer run on the same ref cancels the older one.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Deno
        run: curl -fsSL https://deno.land/install.sh | DENO_INSTALL=$HOME/.deno sh -s v2.9.7

      - name: Deno on PATH
        run: echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Check
        run: bun run check

      - name: Release flow
        if: github.event_name == 'pull_request'
        run: bun ./scripts/release-check.ts --base ${{ github.event.pull_request.base.sha }}

  postgres:
    name: postgres
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres.yml
    with:
      suite_versions: '["15", "18"]'
      tarball_versions: '["18"]'

  attest:
    name: attest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Attest
        run: bun run attest
