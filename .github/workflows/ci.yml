name: CI

# Pull requests only. `gate / check` is the required status. It always runs
# (`if: always()`). A push to main and the nightly run live in after-merge.yml.
#
# The gate is format, lint, typecheck, the build, tests for files changed
# since the merge base, the runtime-entry size ceiling, and the title lint.
# Postgres 18 runs when the diff touches src/dialects, src/runtime, or
# src/tooling/migrate. A label does not start it. A title edit starts this
# workflow again, because the title lint is part of the gate. A body edit
# does not replace that result: the gate repeats the last conclusion for
# the commit. Site tests run when the diff touches src/tooling or
# src/dialects. The Site workflow is not required. The pack contract runs
# when the diff touches src/, scripts/, or package.json. A drift fails
# with `bun ./scripts/pack-contract.ts --update`.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  # A body edit waits, then mirrors. It must not cancel the run for this commit.
  # The flag has to be a boolean. A null title fails the run before any job starts.
  cancel-in-progress: ${{ github.event.action != 'edited' || contains(toJSON(github.event.changes), '"title":') }}

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: changes / filter
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-24.04
    outputs:
      postgres: ${{ steps.plan.outputs.postgres }}
      lifecycle: ${{ steps.plan.outputs.lifecycle }}
      composition: ${{ steps.plan.outputs.composition }}
      site: ${{ steps.plan.outputs.site }}
      pack: ${{ steps.plan.outputs.pack }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require pinned Bun
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < .bun-version)"
          if [ -z "$pin" ]; then
            echo ".bun-version is missing or empty" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Plan
        id: plan
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          bun ./scripts/ci-paths.ts --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

  lint:
    name: lint / static
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Layers
        run: bun run layers-check

      - name: Core purity
        run: bun run core-purity

      - name: OKID drift
        run: bun run okid-drift

      - name: Docs
        run: bun run docs:check

      - name: Readme
        run: bun run readme:check

      - name: Compiler API
        run: bun run compiler-api

      - name: Bundle purity
        run: bun run bundle-purity

      - name: Release flow
        run: bun ./scripts/release-check.ts --base ${{ github.event.pull_request.base.sha }}

  types:
    name: types / compiler
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Cache TypeScript
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'tsconfig.build.json', 'src/**/*.ts', 'scripts/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts') }}
          restore-keys: tsc-${{ runner.os }}-

      - name: Typecheck
        run: bun run typecheck

  build:
    name: build / dist
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Cache dist
        id: dist
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ hashFiles('src/**', 'package.json', 'bun.lock', '.bun-version', 'tsconfig.build.json', 'scripts/write-bin-wrappers.ts', 'packages/harness/src/driver-run.ts') }}

      - name: Build
        if: steps.dist.outputs.cache-hit != 'true'
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  test:
    name: test / changed
    needs: build
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Changed tests
        env:
          OKM_PROPERTY_SCALE: "0.25"
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          merge="$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")"
          bun test --changed="$merge" --pass-with-no-tests

  size:
    name: package / size
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Runtime entry
        run: bun run size -- --runtime-entry

  paths:
    name: label / paths
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'edited' || github.event.changes.title)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Label by path
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

      - name: Pin Bun from the base
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          pin="$(git show "$base:.bun-version" | tr -d '[:space:]')"
          if [ -z "$pin" ]; then
            echo "base .bun-version is missing or empty" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bun-pin"
          printf '%s\n' "$pin" > "$RUNNER_TEMP/bun-pin/.bun-version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ runner.temp }}/bun-pin/.bun-version

      - name: Label by title
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OKM_PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/pr-labels.ts --pr "$PR_NUMBER"

  pull:
    name: lint / pull request
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The lint script is the pull request's. The Bun that runs it is the
      # base pin, so a fork cannot choose the runtime for this token.
      - name: Pin Bun from the base
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          pin="$(git show "$base:.bun-version" | tr -d '[:space:]')"
          if [ -z "$pin" ]; then
            echo "base .bun-version is missing or empty" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bun-pin"
          printf '%s\n' "$pin" > "$RUNNER_TEMP/bun-pin/.bun-version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ runner.temp }}/bun-pin/.bun-version

      - name: Lint pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/pr-lint.ts --pr "$PR_NUMBER"

  suite:
    name: suite
    needs: [build, changes]
    if: (github.event.action != 'edited' || github.event.changes.title) && needs.changes.outputs.postgres == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-suite.yml
    with:
      versions: '["18"]'
      dist_artifact: dist

  lifecycle:
    name: lifecycle / 18
    needs: [changes]
    if: (github.event.action != 'edited' || github.event.changes.title) && needs.changes.outputs.lifecycle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Pull Postgres
        run: docker pull "postgres:${POSTGRES_VERSION}"
        env:
          POSTGRES_VERSION: "18"

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: "18"

      - name: Lifecycle property
        run: bun test tests/lifecycle/lifecycle-pg.test.ts tests/lifecycle/creator-scratch-pg.test.ts
        env:
          REQUIRE_DOCKER: "1"
          POSTGRES_VERSION: "18"
          OKM_LIFECYCLE: "1"
          OKM_LIFECYCLE_TIER: "pr"
          OKM_LIFECYCLE_CASES: "20"
          OKM_LIFECYCLE_SEED: "20261024"

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: "18"

  site:
    name: site / tests
    needs: [changes]
    if: (github.event.action != 'edited' || github.event.changes.title) && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: site
          lockfile: site/bun.lock

      - name: Tests
        working-directory: site
        run: bun run test

  composition:
    name: composition / 18
    needs: [changes]
    if: (github.event.action != 'edited' || github.event.changes.title) && needs.changes.outputs.composition == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Pull Postgres
        run: docker pull "postgres:${POSTGRES_VERSION}"
        env:
          POSTGRES_VERSION: "18"

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: "18"

      - name: Composition cases
        run: bun test tests/composition/composition-pg.test.ts tests/composition/cover.test.ts
        env:
          REQUIRE_DOCKER: "1"
          POSTGRES_VERSION: "18"
          OKM_COMPOSITION: "1"

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: "18"

  pack:
    name: package / contract
    needs: [build, changes]
    if: (github.event.action != 'edited' || github.event.changes.title) && needs.changes.outputs.pack == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Dist is present
        run: test -f dist/contracts/index.js

      - name: Pack contract
        run: bun run pack-contract

  check:
    name: gate / check
    needs:
      [changes, lint, types, build, test, size, pull, paths, suite, lifecycle, composition, site, pack]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Require the slices
        if: github.event.action != 'edited' || github.event.changes.title
        run: >
          bun ./scripts/ci-gate.ts
          --postgres ${{ needs.changes.outputs.postgres == 'true' && '1' || '0' }}
          --lifecycle ${{ needs.changes.outputs.lifecycle == 'true' && '1' || '0' }}
          --composition ${{ needs.changes.outputs.composition == 'true' && '1' || '0' }}
          --site ${{ needs.changes.outputs.site == 'true' && '1' || '0' }}
          --pack ${{ needs.changes.outputs.pack == 'true' && '1' || '0' }}
          changes=${{ needs.changes.result }}
          lint=${{ needs.lint.result }}
          types=${{ needs.types.result }}
          build=${{ needs.build.result }}
          test=${{ needs.test.result }}
          size=${{ needs.size.result }}
          pull=${{ needs.pull.result }}
          paths=${{ needs.paths.result }}
          suite=${{ needs.suite.result }}
          lifecycle=${{ needs.lifecycle.result }}
          composition=${{ needs.composition.result }}
          site=${{ needs.site.result }}
          pack=${{ needs.pack.result }}

      - name: Mirror the last gate on a body edit
        if: github.event.action == 'edited' && github.event.changes.title == null
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: bun ./scripts/ci-gate-mirror.ts
