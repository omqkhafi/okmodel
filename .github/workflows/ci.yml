name: CI

# Runner: every job runs on ubuntu-24.04, not ubuntu-latest. The image is
# pinned, so moving to a newer Ubuntu is a deliberate change made in a pull
# request, not something GitHub does when it moves the latest label.
#
# A push runs on main only. A pull request runs the same jobs. `bun run check`
# is split across lint, types, named test groups, runtimes, and package, so
# the wait is the slowest slice. Every job name is `area / piece`, so the
# check reads `CI / area / piece`. The job named `gate / check` is the
# required status: it passes when every slice that should have run succeeded.
# A docs-only or site-only pull request skips the runtime test matrix
# (test, runtimes, temporal), Postgres, the type-cost step, and attest. A
# skip is a pass only when that filter says the slice is irrelevant. The
# suite and the tarball are also slices when the pull request already has
# `needs: postgres`, unless the same filter says they are irrelevant.
# Without that label they are skipped, and a skip is allowed. A skip or a
# failure while the label is present, and the filter says the suite is
# relevant, fails the gate. One job builds `dist` and uploads it. Test
# groups that need it download it. The others do not build. Release and
# weekly call the suite and tarball workflows themselves. A newer run on
# the same ref cancels the older one.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  changes:
    name: changes / filter
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
      source: ${{ steps.plan.outputs.source }}
      built: ${{ steps.plan.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            bun ./scripts/ci-paths.ts --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          else
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          fi
          bun ./scripts/ci-test-groups.ts --matrix

  build:
    name: build / dist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Cache dist
        id: dist
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ hashFiles('src/**', 'bun.lock', 'tsconfig.build.json', 'scripts/write-bin-wrappers.ts', 'packages/harness/src/driver-run.ts') }}

      - name: Build
        if: steps.dist.outputs.cache-hit != 'true'
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  lint:
    name: lint / static
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Layers
        run: bun run layers-check

      - name: Core purity
        run: bun run core-purity

      - name: OKID drift
        run: bun run okid-drift

      - name: Docs
        run: bun run docs:check

      - name: Readme
        run: bun run readme:check

      - name: Compiler API
        run: bun run compiler-api

      - name: Bundle purity
        run: bun run bundle-purity

      - name: Release flow
        if: github.event_name == 'pull_request'
        run: bun ./scripts/release-check.ts --base ${{ github.event.pull_request.base.sha }}

  types:
    name: types / compiler
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Cache TypeScript
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'tsconfig.build.json', 'src/**/*.ts', 'scripts/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts') }}
          restore-keys: tsc-${{ runner.os }}-

      - name: Typecheck
        run: bun run typecheck

      - name: Editor
        run: bun run editor-check

      - name: Type cost
        if: needs.changes.outputs.runtime != 'false'
        run: bun run type-cost

  test:
    name: test / ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.source) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Test
        run: |
          files="$(bun ./scripts/ci-test-groups.ts "${{ matrix.group }}")"
          if [ -z "$files" ]; then
            echo "no test files"
            exit 1
          fi
          # One process per file. The topology group is two shards so the
          # slow files do not share a job.
          bun test --parallel $files

  test-dist:
    name: test / ${{ matrix.group }}
    needs: [changes, build]
    if: needs.changes.outputs.runtime != 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.built) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Test
        run: |
          test -f dist/contracts/index.js
          files="$(bun ./scripts/ci-test-groups.ts "${{ matrix.group }}")"
          if [ -z "$files" ]; then
            echo "no test files"
            exit 1
          fi
          bun test --parallel $files

  runtimes:
    name: runtimes / portable
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Runtimes
        run: bun run test:runtimes

  temporal:
    name: temporal / node ${{ matrix.node }}
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Date/time columns
        run: |
          bun build scripts/node-temporal.ts --target node --external temporal-polyfill --outfile ./node_modules/.cache/okm-temporal.mjs
          if [ "${{ matrix.node }}" = "26" ]; then
            node ./node_modules/.cache/okm-temporal.mjs
          else
            node ./node_modules/.cache/okm-temporal.mjs --polyfill
          fi

  package:
    name: package / checks
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Dist is present
        run: test -f dist/contracts/index.js

      - name: Publint
        run: bun run publint

      - name: Are the types wrong
        run: bun run attw

      - name: Packed files are tracked
        run: bun run pack-tracked

      - name: Size
        run: bun run size

  check:
    name: gate / check
    needs: [changes, lint, types, test, test-dist, runtimes, temporal, package, suite, tarball]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Require the slices
        run: >
          bun ./scripts/ci-gate.ts --postgres
          ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs: postgres') && '1' || '0' }}
          --runtime
          ${{ needs.changes.outputs.runtime != 'false' && '1' || '0' }}
          changes=${{ needs.changes.result }}
          lint=${{ needs.lint.result }}
          types=${{ needs.types.result }}
          test=${{ needs.test.result }}
          test-dist=${{ needs.test-dist.result }}
          runtimes=${{ needs.runtimes.result }}
          temporal=${{ needs.temporal.result }}
          package=${{ needs.package.result }}
          suite=${{ needs.suite.result }}
          tarball=${{ needs.tarball.result }}

  attest:
    name: attest / measure
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Attest
        run: bun run attest

  paths:
    name: label / paths
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label by path
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

  pull:
    name: lint / pull request
    needs: paths
    if: >-
      github.event_name == 'pull_request' &&
      !cancelled() &&
      (needs.paths.result == 'success' || needs.paths.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Cursor agents cannot PATCH milestones (403). Copy from Closes #N (D206).
      # Inline so this works while the job still checks out the base branch.
      - name: Sync milestone from Closes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          if echo "$meta" | jq -e '.milestone != null' >/dev/null; then
            echo "milestone already set"
            exit 0
          fi
          body="$(echo "$meta" | jq -r '.body // ""')"
          body="${body%%<!-- CURSOR_AGENT_PR_BODY_END -->*}"
          n="$(printf '%s\n' "$body" | sed -n 's/^Closes #\([0-9][0-9]*\)$/\1/p' | tail -1)"
          if [ -z "${n}" ]; then
            echo "no Closes #N line"
            exit 0
          fi
          mil="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}" --jq '.milestone.number // empty')"
          if [ -z "${mil}" ]; then
            echo "issue #${n} has no milestone"
            exit 0
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}" -f "milestone=${mil}"
          echo "set milestone ${mil} from #${n}"

      - name: Lint pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/pr-lint.ts --pr "$PR_NUMBER"

  suite:
    name: suite
    needs: [build, changes]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'needs: postgres') &&
      needs.changes.outputs.runtime == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-suite.yml
    with:
      versions: '["15", "18"]'
      dist_artifact: dist

  tarball:
    name: tarball
    needs: [build, changes]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'needs: postgres') &&
      needs.changes.outputs.runtime == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-tarball.yml
    with:
      versions: '["18"]'
      dist_artifact: dist
