name: CI

# Pull requests only. `gate / check` is the required status. It always runs
# (`if: always()`). A push to main and the nightly run live in after-merge.yml.
#
# The gate is format, lint, typecheck, the build, tests for files changed
# since the merge base, the runtime-entry size ceiling, and the title lint.
# Postgres 18 runs when the diff touches src/dialects, src/runtime, or
# src/tooling/migrate. A label does not start it.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: changes / filter
    runs-on: ubuntu-24.04
    outputs:
      postgres: ${{ steps.plan.outputs.postgres }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read pinned Bun
        id: bun-pin
        run: echo "version=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-pin.outputs.version }}

      - name: Plan
        id: plan
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          bun ./scripts/ci-paths.ts --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

  lint:
    name: lint / static
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Layers
        run: bun run layers-check

      - name: Core purity
        run: bun run core-purity

      - name: OKID drift
        run: bun run okid-drift

      - name: Docs
        run: bun run docs:check

      - name: Readme
        run: bun run readme:check

      - name: Compiler API
        run: bun run compiler-api

      - name: Bundle purity
        run: bun run bundle-purity

      - name: Release flow
        run: bun ./scripts/release-check.ts --base ${{ github.event.pull_request.base.sha }}

  types:
    name: types / compiler
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Cache TypeScript
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'tsconfig.build.json', 'src/**/*.ts', 'scripts/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts') }}
          restore-keys: tsc-${{ runner.os }}-

      - name: Typecheck
        run: bun run typecheck

  build:
    name: build / dist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Cache dist
        id: dist
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ hashFiles('src/**', 'bun.lock', 'tsconfig.build.json', 'scripts/write-bin-wrappers.ts', 'packages/harness/src/driver-run.ts') }}

      - name: Build
        if: steps.dist.outputs.cache-hit != 'true'
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  test:
    name: test / changed
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Changed tests
        env:
          OKM_PROPERTY_SCALE: "0.25"
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          merge="$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")"
          bun test --changed="$merge" --pass-with-no-tests

  size:
    name: package / size
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Runtime entry
        run: bun run size -- --runtime-entry

  paths:
    name: label / paths
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Label by path
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

      - name: Read pinned Bun
        id: bun-pin
        run: echo "version=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-pin.outputs.version }}

      - name: Label by title
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OKM_PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/pr-labels.ts --pr "$PR_NUMBER"

  pull:
    name: lint / pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Lint pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/pr-lint.ts --pr "$PR_NUMBER"

  suite:
    name: suite
    needs: [build, changes]
    if: needs.changes.outputs.postgres == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-suite.yml
    with:
      versions: '["18"]'
      dist_artifact: dist

  check:
    name: gate / check
    needs: [changes, lint, types, build, test, size, pull, paths, suite]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Require the slices
        run: >
          bun ./scripts/ci-gate.ts
          --postgres ${{ needs.changes.outputs.postgres == 'true' && '1' || '0' }}
          changes=${{ needs.changes.result }}
          lint=${{ needs.lint.result }}
          types=${{ needs.types.result }}
          build=${{ needs.build.result }}
          test=${{ needs.test.result }}
          size=${{ needs.size.result }}
          pull=${{ needs.pull.result }}
          paths=${{ needs.paths.result }}
          suite=${{ needs.suite.result }}
