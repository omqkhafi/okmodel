name: Postgres

# Reusable tarball job. The caller job is named `tarball`, so a run reads
# `Postgres / tarball / 18`. A pull request does not run it. A push to main,
# the nightly run, and a release pass every supported major.
on:
  workflow_call:
    inputs:
      versions:
        description: JSON list of Postgres majors
        required: true
        type: string
      tarball_artifact:
        description: Artifact name of one packed tarball. Empty packs inside the job.
        required: false
        default: ""
        type: string
      dist_artifact:
        description: Artifact name of a prebuilt dist. Empty builds inside the job when it packs.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  tarball:
    name: ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Download dist
        if: inputs.dist_artifact != '' && inputs.tarball_artifact == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.dist_artifact }}
          path: dist

      - name: Dist is present
        if: inputs.dist_artifact != '' && inputs.tarball_artifact == ''
        run: test -f dist/contracts/index.js

      - name: Download tarball
        if: inputs.tarball_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tarball_artifact }}
          path: packed

      - name: Build
        if: inputs.tarball_artifact == '' && inputs.dist_artifact == ''
        run: bun run build

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Tarball quickstart
        run: bun ./scripts/tarball-smoke.ts
        env:
          REQUIRE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}
          OKMODEL_TARBALL: ${{ inputs.tarball_artifact != '' && format('{0}/packed/okmodel.tgz', github.workspace) || '' }}

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: ${{ matrix.version }}
