name: Postgres

# Reusable tarball job. The caller job is named `tarball`, so a run reads
# `Postgres / tarball / 18`. A pull request with `needs: postgres` passes the
# newest. Release and weekly pass every supported major.
on:
  workflow_call:
    inputs:
      versions:
        description: JSON list of Postgres majors
        required: true
        type: string
      tarball_artifact:
        description: Artifact name of one packed tarball. Empty packs inside the job.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  tarball:
    name: ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download tarball
        if: inputs.tarball_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.tarball_artifact }}
          path: packed

      - name: Build
        if: inputs.tarball_artifact == ''
        run: bun run build

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Tarball quickstart
        run: bun ./scripts/tarball-smoke.ts
        env:
          REQUIRE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}
          OKMODEL_TARBALL: ${{ inputs.tarball_artifact != '' && format('{0}/packed/okmodel.tgz', github.workspace) || '' }}

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: ${{ matrix.version }}
