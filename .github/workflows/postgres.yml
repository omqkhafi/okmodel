name: Postgres

on:
  workflow_call:

permissions:
  contents: read

jobs:
  suite:
    name: postgres ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["13", "14", "15", "16", "17", "18"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Postgres suite
        run: bun ./scripts/postgres-suite.ts
        env:
          REQUIRE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

  tarball:
    name: tarball ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["13", "14", "15", "16", "17", "18"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Tarball quickstart
        run: bun ./scripts/tarball-smoke.ts
        env:
          REQUIRE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: ${{ matrix.version }}
