name: Postgres

# Reusable suite and tarball jobs. Callers pass JSON lists of majors.
# A pull request passes the floor and the newest for the suite, and the
# newest for the tarball. The release and the weekly run pass every
# supported major for both.
on:
  workflow_call:
    inputs:
      suite_versions:
        description: JSON list of Postgres majors for the suite
        required: true
        type: string
      tarball_versions:
        description: JSON list of Postgres majors for the tarball job
        required: true
        type: string
      tarball_artifact:
        description: Artifact name of one packed tarball. Empty packs inside the job.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  suite:
    name: postgres ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.suite_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Postgres suite
        run: bun ./scripts/postgres-suite.ts
        env:
          REQUIRE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

  tarball:
    name: tarball ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.tarball_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download tarball
        if: inputs.tarball_artifact != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.tarball_artifact }}
          path: packed

      - name: Build
        if: inputs.tarball_artifact == ''
        run: bun run build

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: ${{ matrix.version }}

      - name: Tarball quickstart
        run: bun ./scripts/tarball-smoke.ts
        env:
          REQUIRE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}
          OKMODEL_TARBALL: ${{ inputs.tarball_artifact != '' && format('{0}/packed/okmodel.tgz', github.workspace) || '' }}

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: ${{ matrix.version }}
