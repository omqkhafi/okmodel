name: Labeler

# Adds area: labels from changed paths. The action reads the pull request
# files through the API. This workflow does not check out pull request code.
# pull_request_target runs the workflow from the base branch, so a change to
# this file or to labeler.yml applies on the next pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    name: labeler
    runs-on: ubuntu-24.04
    steps:
      - name: Label by path
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
