name: Weekly

# The Monday matrix moved to after-merge.yml (push to main and nightly).
# This dispatch runs the same Postgres matrix by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: suite
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-suite.yml
    with:
      versions: '["15", "16", "17", "18"]'

  tarball:
    name: tarball
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-tarball.yml
    with:
      versions: '["15", "16", "17", "18"]'
