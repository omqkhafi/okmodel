name: Weekly

# Full Postgres matrix, suite and tarball, Monday 06:00 UTC.
# A pull request runs a shorter list from postgres-pr.yml when it has the
# label `needs: postgres`.
on:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  postgres:
    name: postgres
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres.yml
    with:
      suite_versions: '["15", "16", "17", "18"]'
      tarball_versions: '["15", "16", "17", "18"]'
