name: Weekly

# Full Postgres matrix, suite and tarball, Monday 06:00 UTC.
# A pull request runs a shorter list from postgres-pr.yml when it has the
# label `needs: postgres`.
on:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  suite:
    name: suite
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-suite.yml
    with:
      versions: '["15", "16", "17", "18"]'

  tarball:
    name: tarball
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-tarball.yml
    with:
      versions: '["15", "16", "17", "18"]'
