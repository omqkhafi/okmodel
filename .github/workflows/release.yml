name: Release

# Runner: every job runs on ubuntu-24.04, not ubuntu-latest.
#
# A push of a tag v* is the only publish trigger. The tag job refuses the
# run, before any build, unless the tagged commit is an ancestor of
# origin/main (`git merge-base --is-ancestor`), the tag equals the
# package.json version, and changelog.md has a ## v section for it.
#
# workflow_dispatch with publish left false is a dry run of that tag job.
# It passes on main and fails when the selected ref is a tag of a commit
# that is not on main. The publish step does not run.
#
# Publish stages the tested tarball with npm stage publish (npm >= 11.15.0,
# Node >= 22.14). Bun builds and tests. bun publish has no OIDC, provenance,
# or staging. No npm token is stored. The publish job is the release
# Environment and is the only job with id-token: write and contents: write.
# The build job packs once. It records that tarball's sha256 and file list
# in the job summary and the release-record artifact. Publish stages that
# same tarball. The verify job compares the registry copy to the record.
# A rebuild of the tag is not a gate.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Stage the package on npm. False runs the tag checks only.
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: tag / version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Require the tag on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "HEAD is not an ancestor of origin/main"
            exit 1
          fi
          bun ./scripts/release-ref.ts
        env:
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

  build:
    name: build / pack
    needs: tag
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run build

      - name: Pack tracked
        run: bun ./scripts/pack-tracked.ts --release

      - name: Pack contract
        run: bun run pack-contract

      - name: Pack
        run: |
          set -euo pipefail
          bun pm pack
          file="$(find . -maxdepth 1 -name 'okmodel-*.tgz' -print)"
          test -n "$file"
          mv "$file" okmodel.tgz
          sha="$(bun ./scripts/verify-release.ts --write-record okmodel.tgz release-record.json)"
          {
            echo "### Release tarball"
            echo
            echo "Compare this sha256 with the staged package before approving it."
            echo
            echo "sha256: \`$sha\`"
            echo
            echo '```json'
            cat release-record.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: okmodel.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload release record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record
          path: release-record.json
          if-no-files-found: error
          retention-days: 1

  suite:
    name: suite
    needs: tag
    if: github.event_name == 'push' || inputs.publish == true
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-suite.yml
    with:
      versions: '["15", "16", "17", "18"]'

  tarball:
    name: tarball
    needs: build
    if: github.event_name == 'push' || inputs.publish == true
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres-tarball.yml
    with:
      versions: '["15", "16", "17", "18"]'
      tarball_artifact: release-tarball

  gate:
    name: gate / passed
    needs: [suite, tarball]
    if: always() && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-24.04
    steps:
      - name: Require the matrix
        run: |
          fail=0
          for pair in "suite=${{ needs.suite.result }}" "tarball=${{ needs.tarball.result }}"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "$name $result"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          done
          exit "$fail"

  publish:
    name: publish / npm
    needs: gate
    if: github.event_name == 'push' || inputs.publish == true
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14"

      - name: Require npm 11.15
        run: npm install -g npm@11.15.0

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: packed

      - name: npm stage publish
        if: github.event_name == 'push' || inputs.publish == true
        run: bun ./scripts/stage-publish.ts ./packed/okmodel.tgz
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: GitHub Release
        run: bun ./scripts/github-release.ts
        env:
          GH_TOKEN: ${{ github.token }}

  verify:
    name: verify / published
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14"

      - name: Download release record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-record
          path: recorded

      - name: Verify the published tarball
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          bun ./scripts/verify-release.ts "$version" --recorded ./recorded/release-record.json
