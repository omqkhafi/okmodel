name: Release

# Runner: every job runs on ubuntu-24.04, not ubuntu-latest. The image is
# pinned, so moving to a newer Ubuntu is a deliberate change made in a pull
# request, not something GitHub does when it moves the latest label.
#
# Manual. Ali runs this on the tag v<package.json version>. This file does
# not run on push. scripts/release-ref.ts reads the version after checkout
# and refuses any other ref. That check runs before the Postgres gate.
#
# The gate tests one packed tarball. Publish uploads that same file.
# Two releases cannot run at the same time.
#
# Provenance: id-token write lets npm attach a statement that this
# workflow built the tarball. The package needs a trusted publisher for
# this repository and this workflow. No npm token is stored here.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Require the version tag
        run: bun ./scripts/release-ref.ts

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack
        run: |
          bun pm pack
          file="$(find . -maxdepth 1 -name 'okmodel-*.tgz' -print)"
          test -n "$file"
          mv "$file" okmodel.tgz

      - name: Upload tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-tarball
          path: okmodel.tgz
          if-no-files-found: error
          retention-days: 1

  gate:
    name: postgres
    needs: tag
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/postgres.yml
    with:
      suite_versions: '["15", "16", "17", "18"]'
      tarball_versions: '["15", "16", "17", "18"]'
      tarball_artifact: release-tarball

  publish:
    name: publish
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Download tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-tarball
          path: packed

      - name: Publish
        run: npm publish packed/okmodel.tgz --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"

  smoke:
    name: smoke
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Start Postgres
        run: bun run db:up
        env:
          POSTGRES_VERSION: "17"

      - name: Smoke
        run: bun ./scripts/npm-smoke.ts
        env:
          POSTGRES_VERSION: "17"

      - name: Stop Postgres
        if: always()
        run: bun run db:down
        env:
          POSTGRES_VERSION: "17"

  github-release:
    name: github release
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: GitHub Release
        run: bun ./scripts/github-release.ts
        env:
          GH_TOKEN: ${{ github.token }}
