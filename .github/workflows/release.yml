name: Release

# Manual. Ali runs this after the v0.1.0 tag is on the commit whose
# package.json version is 0.1.0. This file does not run on push.
#
# Provenance: id-token write lets npm attach a statement that this
# workflow built the tarball. The package needs a trusted publisher for
# this repository and this workflow. No npm token is stored here.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Require the v0.1.0 tag
        run: |
          if [ "$GITHUB_REF" != "refs/tags/v0.1.0" ]; then
            echo "Refusing to publish from $GITHUB_REF. Run: gh workflow run release.yml --ref v0.1.0"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
