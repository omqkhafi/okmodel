name: Release

# Manual only. This workflow does not publish.
#
# When publishing is turned on, this workflow will:
# - check out the release commit
# - install with a frozen lockfile
# - run the repository checks
# - publish okmodel to npm with provenance
#
# npm provenance is an attestation that the tarball was built by this
# workflow on the public repository. Turning it on means:
# - permissions.id-token: write (and contents: read)
# - a trusted publisher, or `bun publish` / `npm publish --provenance`
#   from GitHub Actions, so npm attaches the provenance statement
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Not publishing
        run: echo "Release is not implemented yet. This workflow does not publish."
