name: Site

# The docs site. Not part of `gate / check`. A pull request or a push to main
# runs it when the site, the handbook sources, the README, or the changelog
# change. Nothing here starts the Postgres suite.
on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "changelog.md"
      - ".github/workflows/site.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "changelog.md"
      - ".github/workflows/site.yml"

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: install
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: site
          lockfile: site/bun.lock

  content:
    name: content check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: site
          lockfile: site/bun.lock

      - name: Pages
        working-directory: site
        run: bun test ./scripts/content.site-test.ts

  types:
    name: types
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: site
          lockfile: site/bun.lock

      - name: Types
        working-directory: site
        run: bun run types

  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: site
          lockfile: site/bun.lock

      - name: Tests
        working-directory: site
        run: bun run test

  # Needs the built package. The tests job does not install the library.
  code:
    name: docs code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Install site
        uses: ./.github/actions/setup-bun
        with:
          working-directory: site
          lockfile: site/bun.lock

      - name: Build library
        run: bun run build

      - name: Docs code
        working-directory: site
        run: bun test ./scripts/docs-code.site-test.ts

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: site
          lockfile: site/bun.lock

      - name: Build
        working-directory: site
        run: bun run build
