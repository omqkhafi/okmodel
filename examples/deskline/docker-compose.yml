services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_USER: deskline
      POSTGRES_PASSWORD: deskline
      POSTGRES_DB: deskline
    ports:
      - "55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskline -d deskline"]
      interval: 2s
      timeout: 3s
      retries: 15
